basePath: /api/v1
definitions:
  cost.COGSReportResponse:
    properties:
      branch_id:
        type: string
      from:
        type: string
      to:
        type: string
      total_cogs:
        type: number
    type: object
  cost.EstimatedContributionResponse:
    properties:
      estimated_contribution:
        type: number
      gross_profit:
        type: number
      labor_cost:
        type: number
    type: object
  cost.GrossProfitReportResponse:
    properties:
      gross_profit:
        type: number
      total_cogs:
        type: number
      total_revenue:
        type: number
    type: object
  cost.MenuItemCostingResponse:
    properties:
      components:
        items:
          $ref: '#/definitions/cost.RecipeComponentResponse'
        type: array
      cost_amount:
        type: number
      food_cost_pct:
        type: number
      gross_profit:
        type: number
      last_updated:
        type: string
      menu_item_id:
        type: string
      selling_price:
        type: number
    type: object
  cost.RecipeComponentRequest:
    properties:
      good_id:
        type: string
      quantity:
        type: number
      unit:
        type: string
    required:
    - good_id
    - quantity
    - unit
    type: object
  cost.RecipeComponentResponse:
    properties:
      good_id:
        type: string
      quantity:
        type: number
      unit:
        type: string
    type: object
  cost.SetCostRequest:
    properties:
      components:
        items:
          $ref: '#/definitions/cost.RecipeComponentRequest'
        type: array
      cost_amount:
        minimum: 0
        type: number
      menu_item_id:
        type: string
    required:
    - cost_amount
    - menu_item_id
    type: object
host: localhost:9007
info:
  contact: {}
  description: Cost & Profitability API.
  title: Cost API
  version: "1.0"
paths:
  /cost/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Cost & BOM Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cost.SetCostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Set Menu Item Cost
      tags:
      - Costing
  /cost/items/{id}:
    get:
      parameters:
      - description: Menu Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cost.MenuItemCostingResponse'
      summary: Get Menu Item Costing
      tags:
      - Costing
  /cost/reports/cogs:
    get:
      parameters:
      - description: Filter by branch ID
        in: query
        name: branch_id
        type: string
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cost.COGSReportResponse'
      summary: Get COGS Report
      tags:
      - Reports
  /cost/reports/estimated-contribution:
    get:
      parameters:
      - description: Filter by branch ID
        in: query
        name: branch_id
        type: string
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cost.EstimatedContributionResponse'
      summary: Get Estimated Contribution
      tags:
      - Reports
  /cost/reports/gross-profit:
    get:
      parameters:
      - description: Filter by branch ID
        in: query
        name: branch_id
        type: string
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cost.GrossProfitReportResponse'
      summary: Get Gross Profit Report
      tags:
      - Reports
swagger: "2.0"
