name: API contract validation

on:
  pull_request:
    paths:
      - 'docs/api/**'
      - 'services/**/internal/**/handler.go'
      - 'services/**/cmd/api/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'services/**/internal/**/handler.go'
      - 'services/**/cmd/api/**'
      - '.github/workflows/api-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenAPI 3.1 contract
        run: npx --yes @redocly/cli lint --config docs/api/redocly.yaml docs/api/openapi.yaml --format=summary
