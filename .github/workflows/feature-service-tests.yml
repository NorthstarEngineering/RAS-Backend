name: Feature service tests

on:
  pull_request:
    paths: ["services/**", ".github/workflows/feature-service-tests.yml"]
  push:
    branches: [main, "codex/**"]
    paths: ["services/**", ".github/workflows/feature-service-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false
      - name: Test every service module
        shell: bash
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r module; do
            dir="$(dirname "$module")"
            echo "=== $dir ==="
            (cd "$dir" && gofmt -w $(find . -name '*.go') && go vet ./... && go test ./... -cover)
            result=$?
            if [ "$result" -ne 0 ]; then status=1; fi
          done < <(find services -name go.mod | sort)
          exit "$status"
