name: Feature service tests

on:
  pull_request:
    paths: ["services/**", ".github/workflows/feature-service-tests.yml"]
  push:
    branches: [main, "feature/**"]
    paths: ["services/**", ".github/workflows/feature-service-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/transfer-api/go.mod
          cache-dependency-path: services/transfer-api/go.sum
      - name: Format test files
        run: gofmt -w services/transfer-api/internal/transfer/service_test.go
      - name: Vet
        working-directory: services/transfer-api
        run: go vet ./...
      - name: Unit tests with coverage
        working-directory: services/transfer-api
        run: go test ./... -covermode=atomic -coverprofile=coverage.out -json | tee test-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-api-test-results-${{ github.sha }}
          if-no-files-found: warn
          path: |
            services/transfer-api/test-results.json
            services/transfer-api/coverage.out
