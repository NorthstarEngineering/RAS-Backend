name: Feature service tests

on:
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/feature-service-tests.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "services/**"
      - ".github/workflows/feature-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/central-kitchen-supply/go.mod
          cache-dependency-path: services/central-kitchen-supply/go.sum
      - name: Format test files
        run: gofmt -w services/central-kitchen-supply/internal/inventory/model_test.go
      - name: Vet
        working-directory: services/central-kitchen-supply
        run: go vet ./...
      - name: Unit tests with coverage
        working-directory: services/central-kitchen-supply
        run: go test ./... -covermode=atomic -coverprofile=coverage.out -json | tee test-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-kitchen-supply-test-results-${{ github.sha }}
          if-no-files-found: warn
          path: |
            services/central-kitchen-supply/test-results.json
            services/central-kitchen-supply/coverage.out
